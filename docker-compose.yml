# Production stack for ahantime.com:
#   web   — the Next.js app (standalone), reachable only inside the network
#   caddy — public reverse proxy that terminates TLS (auto Let's Encrypt) on 80/443
#
# Usage:  cp .env.example .env && edit .env   then   docker compose up -d --build
services:
  web:
    # `image:` + `build:` together is Compose's "build once, deploy many"
    # pattern: CI builds and pushes this exact tag to GHCR once (see
    # .github/workflows/deploy.yml), and `docker compose pull && up -d` on
    # the server only ever pulls that pre-built layer — the server never
    # spends its own CPU/RAM compiling Next.js. `build:` stays here purely
    # for local dev (`docker compose up -d --build` still works without any
    # of this) and as a manual fallback if the registry is ever unreachable.
    image: ${WEB_IMAGE:-ghcr.io/am1eza/iron-web:local}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ahantime.com}
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-live}
        # See GEO-ROUTING.md — a free-form label, just surfaced on /api/health
        # so a geo-split setup can be verified (curl from Iran vs. abroad and
        # confirm each hit the origin you expect).
        NEXT_PUBLIC_DEPLOY_REGION: ${NEXT_PUBLIC_DEPLOY_REGION:-ir-docker}
        MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
        GTM_ID: ${GTM_ID:-}
        GA4_ID: ${GA4_ID:-}
        GSC_VERIFICATION: ${GSC_VERIFICATION:-}
    restart: unless-stopped
    # Hardening: no privilege escalation, drop all Linux caps (the app runs as
    # the non-root `nextjs` user on port 3000 — it needs none), and bound
    # memory/PIDs so a leak or fork-bomb can't take the 8GB host down.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 512
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Multi-core serving (see web/cluster.mjs). Node runs JS on one thread,
      # so a single process used exactly one of this host's 4 vCPUs — measured
      # with k6 at 500 concurrent visitors: CPU pinned at ~100% (one core)
      # while Postgres idled at ~0%, and homepage p99 latency blew out to
      # ~15s. 3 workers leaves a core for Postgres/Redis/Caddy, which share
      # this box.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Per-process pool — the real draw is WEB_CONCURRENCY × this, PLUS the
      # separate jobs process (also PG_POOL_MAX). At 3×10 + 10 = 40 against
      # Postgres's max_connections=100 below, there's ample headroom for
      # psql/pg_dump/admin sessions during a deploy.
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      # REQUIRED — the app refuses to start in production without this.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ahantime.com}
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-live}
      AUTH_ENFORCED: ${AUTH_ENFORCED:-true}
      # Tags every error sent to GlitchTip with the exact image it came from,
      # so "is this still happening on what is deployed now?" is answerable.
      # WEB_IMAGE already carries the build's git sha, so this needs no extra
      # step in the deploy path.
      APP_RELEASE: ${WEB_IMAGE:-local}
      DATABASE_URL: postgres://ahantime:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ahantime
      SEED_ON_START: ${SEED_ON_START:-true}   # idempotent — only fills empty tables
      # SMS.ir — REQUIRED with the defaults above (live mode + AUTH_ENFORCED):
      # OTP login has no fallback, so the app refuses to boot without these.
      SMSIR_API_KEY: ${SMSIR_API_KEY:?set SMSIR_API_KEY in .env (OTP login has no fallback in live mode)}
      SMSIR_TEMPLATE_ID: ${SMSIR_TEMPLATE_ID:?set SMSIR_TEMPLATE_ID in .env (OTP verify template on the SMS.ir panel)}
      SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-}   # optional — پیش‌فاکتور/alert texts dev-log if unset
      SMSIR_TEMPLATE_PARAM: ${SMSIR_TEMPLATE_PARAM:-}  # verify-template placeholder name (default OTP — must match #…# in the panel template)
      # Per-notification Verify template ids (docs/SMS-TEMPLATES.md has the
      # exact text to register on the panel). Each optional: unset → that ONE
      # message stays on the free-text bulk line above, nothing else changes.
      SMSIR_TEMPLATE_ID_PROFORMA_REQUEST: ${SMSIR_TEMPLATE_ID_PROFORMA_REQUEST:-}
      SMSIR_TEMPLATE_ID_PROFORMA_ISSUED: ${SMSIR_TEMPLATE_ID_PROFORMA_ISSUED:-}
      SMSIR_TEMPLATE_ID_PROFORMA_REMINDER: ${SMSIR_TEMPLATE_ID_PROFORMA_REMINDER:-}
      SMSIR_TEMPLATE_ID_ORDER_CONFIRMED: ${SMSIR_TEMPLATE_ID_ORDER_CONFIRMED:-}
      SMSIR_TEMPLATE_ID_ORDER_STATUS: ${SMSIR_TEMPLATE_ID_ORDER_STATUS:-}
      SMSIR_TEMPLATE_ID_ORDER_DELIVERED: ${SMSIR_TEMPLATE_ID_ORDER_DELIVERED:-}
      SMSIR_TEMPLATE_ID_ORDER_SHIPPING: ${SMSIR_TEMPLATE_ID_ORDER_SHIPPING:-}
      SMSIR_TEMPLATE_ID_ORDER_CANCELLED: ${SMSIR_TEMPLATE_ID_ORDER_CANCELLED:-}
      SMSIR_TEMPLATE_ID_PRICE_ALERT: ${SMSIR_TEMPLATE_ID_PRICE_ALERT:-}
      SMSIR_TEMPLATE_ID_CALLBACK_REMINDER: ${SMSIR_TEMPLATE_ID_CALLBACK_REMINDER:-}
      SMSIR_TEMPLATE_ID_WAREHOUSE_REQUEST: ${SMSIR_TEMPLATE_ID_WAREHOUSE_REQUEST:-}
      OTP_FALLBACK_AFTER_MS: ${OTP_FALLBACK_AFTER_MS:-}  # delivery-watchdog delay before 2nd-route resend (default 30000; 0 disables)
      # Analytics — each empty until the owner supplies the id (GTM/GA also
      # need a rebuild for CSP; Matomo + GSC are runtime-only).
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
      GTM_ID: ${GTM_ID:-}
      GA4_ID: ${GA4_ID:-}
      GSC_VERIFICATION: ${GSC_VERIFICATION:-}
      # Google Search Console API (US-14.4) — the per-article "what is this
      # page ranking for" panel. Distinct from GSC_VERIFICATION above, which
      # is only the ownership meta tag. All blank in production: the OAuth
      # client has to be created by the owner in Google Cloud, and until these
      # three are set `isSearchConsoleConfigured()` is false, the daily refresh
      # job no-ops and no Search Console UI renders anywhere.
      GSC_CLIENT_ID: ${GSC_CLIENT_ID:-}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET:-}
      # The property EXACTLY as Search Console spells it: `sc-domain:ahantime.com`
      # for a Domain property, or `https://ahantime.com/` (with the trailing
      # slash) for a URL-prefix one. Google matches this literally.
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      # Only if the callback lives somewhere other than the panel host default.
      GSC_REDIRECT_URI: ${GSC_REDIRECT_URI:-}
      # Relay overrides, same shape as AI_BASE_URL. Google is directly
      # reachable from this host today (measured: accounts/oauth2/searchconsole
      # all answer in well under a second), so these stay empty — they exist so
      # that if Google is ever filtered, pointing at an out-of-Iran proxy is an
      # .env edit rather than a code change.
      GSC_AUTH_BASE_URL: ${GSC_AUTH_BASE_URL:-}
      GSC_TOKEN_BASE_URL: ${GSC_TOKEN_BASE_URL:-}
      GSC_API_BASE_URL: ${GSC_API_BASE_URL:-}
      # Fully optional integrations (dev fallbacks / last-known values apply when blank).
      # TGJU_BASE_URL defaults to the self-hosted `tgju` service below —
      # override only to point at a different relay. OUNCE_API_URL has its
      # own free/keyless default baked into tgju.ts; only set it to switch
      # providers.
      TGJU_BASE_URL: ${TGJU_BASE_URL:-http://tgju:8000}
      OUNCE_API_URL: ${OUNCE_API_URL:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # AI advisor per-turn deadline (web/src/lib/config/constants.ts).
      # Bumped 2026-08-16: was silently stuck at the code default (45s)
      # because this var was never forwarded into the container at all —
      # setting it in .env alone does nothing without this line.
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      DEV_ADMIN_MOBILE: ${DEV_ADMIN_MOBILE:-}
      ADMIN_MOBILES: ${ADMIN_MOBILES:-}
      SENTRY_DSN: ${SENTRY_DSN:-}   # optional — errors stay console-only if unset
      # Redis: distributed rate limiting + read-through cache. Unset → app
      # falls back to the in-process window and direct DB reads.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    volumes:
      # Admin-uploaded images (article covers, SKU photos — US-20.2). The web
      # image is stateless/rebuilt-and-redeployed on every release (see the
      # comment on `image:`/`build:` above), so anything written at runtime
      # under `public/` needs its own named volume or it's lost on redeploy.
      - uploads:/app/public/uploads
      # Next's on-demand image optimizer writes every encode it produces here.
      # Without this volume the cache lived only inside the container, so every
      # `docker compose up -d` — i.e. every single deploy — threw away all of
      # it and the next visitor paid full re-encode cost on every image. Caught
      # it at 52 KB total, 24 minutes after a restart, which is the whole cache
      # for the whole site: proof it had just been wiped rather than warmed.
      #
      # Safe to persist across releases: optimizer entries are keyed by source
      # URL + width + quality + content hash, and the ISR entries that share
      # this directory are keyed by build ID, so a new build cannot read a
      # previous build's stale pages.
      #
      # Docker seeds an empty named volume from the image path — INCLUDING its
      # ownership — but only when that path exists in the image. `.next/cache`
      # is created by Next at runtime, so it does not, and the volume came up
      # root-owned while the app runs as non-root `nextjs`: every write failed
      # with EACCES and the cache stayed empty. web/Dockerfile now pre-creates
      # and chowns it, exactly as it already did for `uploads`. A volume
      # created BEFORE that Dockerfile change keeps its root ownership and
      # needs the one-time repair recorded there.
      - nextcache:/app/.next/cache
    expose:
      - "3000"          # internal only — not published to the host
    # W23 review fix: the host's own DNS (forwarded from Docker's embedded
    # 127.0.0.11 resolver) failed to resolve gold-api.com (ENOTFOUND) while
    # resolving api.deepseek.com/api.github.com fine — confirmed via
    # `docker exec … dns.Resolver` against 1.1.1.1, which resolved it
    # instantly. Whatever gap the host's configured external resolvers have
    # for smaller/less-common domains, it's not worth chasing per-domain —
    # give this container its own reliable public resolvers instead.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      # No curl/wget in the minimal node:alpine runner image — use Node's
      # built-in fetch instead of adding a package just for this.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # migrations (+ optional seed) run before server.js starts

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # No cap_drop here: the postgres entrypoint starts as root and drops to the
    # postgres user itself, so it needs its default caps. Still block privilege
    # escalation and bound resources.
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 512
    # Tuned for the 1.5GB container / 4-vCPU host (was running on stock defaults:
    # 128MB shared_buffers, spinning-disk cost model). SSD + modern sizing.
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=100
    environment:
      POSTGRES_DB: ahantime
      POSTGRES_USER: ahantime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahantime -d ahantime"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No cap_drop: the redis entrypoint starts as root and drops to the redis
    # user itself (needs SETUID/SETGID), same as the postgres service.
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 256
    # Password-protected, 256MB cap with LRU eviction (it's a cache), AOF
    # persistence so rate-limit/session counters survive a restart. Not published
    # to the host — only reachable on the internal compose network.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Self-hosted currency/gold scraper for the نبض بازار ticker — tgju.org has
  # no official public API (sanctions-era Iran has none), so this small
  # community FastAPI project (github.com/BlackIQ/tgju-api) fronts it for
  # us. Pinned to a known commit inside services/tgju/Dockerfile — see that
  # file's header for why it clones+builds their source itself instead of
  # pointing `build:` at their repo directly (their published Dockerfile is
  # broken as of the pinned commit). `web` degrades gracefully (last-known
  # values, isStale=true) if this is ever down — see tgju.ts — so it does
  # NOT gate web's healthcheck/startup.
  tgju:
    build:
      context: ./services/tgju
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    expose:
      - "8000"          # internal only — not published to the host
    healthcheck:
      # Hits /openapi.json (always served, instant, no upstream call) rather
      # than /api/price/* — those live-scrape tgju.org on EVERY request, no
      # caching (see scrap/tgju.py), so polling one as a healthcheck would
      # hammer tgju.org every 30s on top of our own market-poll usage, purely
      # to answer "is the process up", which /openapi.json answers just as
      # well without the extra load or the occasional multi-second scrape
      # latency tripping a tight timeout.
      test: ["CMD", "python3", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/openapi.json',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s

  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 512
    command: --max-allowed-packet=64MB
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD:?set MATOMO_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:?set MATOMO_DB_PASSWORD in .env}
    volumes:
      - matomodb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    # The only service reachable from TWO public paths (the :8443 console and,
    # for two allowlisted tracker files, the customer origin), and the last one
    # here still running unbounded. Matches the limits every other service in
    # this file already carries.
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - matomodata:/var/www/html

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Keeps default caps (needs NET_BIND_SERVICE for :80/:443), but blocks
    # privilege escalation and bounds resources.
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # Operator-only consoles — bound to LOOPBACK, deliberately not public.
      #
      # Do NOT "fix" this by opening the firewall: a published Docker port
      # inserts its own DNAT rule into the nat table and BYPASSES firewalld
      # entirely, so `firewall-cmd --remove-port=9443/tcp` closes nothing while
      # looking like it did. The bind address is the only control that works.
      #
      # Reach them over an SSH tunnel:
      #   ssh -L 8443:127.0.0.1:8443 -L 9443:127.0.0.1:9443 root@<host>
      # then open https://ahantime.com:8443 / :9443 locally (the certificate is
      # issued for ahantime.com, so use that hostname, not localhost).
      - "127.0.0.1:8443:8443"   # Matomo admin UI (analytics)
      - "127.0.0.1:9443:9443"   # GlitchTip (errors + uptime)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists issued certificates across restarts
      - caddy_config:/config

  # ---------------------------------------------------------------------------
  # GlitchTip — self-hosted, Sentry-protocol-compatible error tracking.
  # The app has shipped a hand-rolled Sentry envelope reporter since day one
  # (web/src/lib/errors/sentry.ts, 77 call sites); it no-ops whenever SENTRY_DSN
  # is unset, which it always was. Pointing that DSN here turns it on with zero
  # code change. Exposed on :9443 of the existing certificate, same trick as
  # Matomo on :8443 — no extra DNS record needed.
  # ---------------------------------------------------------------------------
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Deliberately NOT the app's postgres: error payloads are a different data
    # domain with a different retention policy, and the nightly app backup must
    # not balloon with event rows.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in .env}
    volumes:
      - glitchtipdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    # Its own instance on purpose. The app's redis runs allkeys-lru because it
    # is a cache; this one is a Celery BROKER, and evicting a broker key loses
    # queued work silently. noeviction makes a full queue fail loudly instead.
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  glitchtip-web:
    image: glitchtip/glitchtip@sha256:ef28cc4b92c8c9e427b8ddd55682d6aa155129ddf1c5db5f6bbbd09155fd3b6e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 900m
    pids_limit: 512
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    environment: &glitchtip_env
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env}
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://ahantime.com:9443
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:-ahantime.com,glitchtip-web,localhost}
      # No SMTP exists on this host, so invitations/password resets cannot be
      # delivered. Registration stays CLOSED — the account is provisioned from
      # the CLI instead. Do not flip this on without re-reading that sentence.
      #
      # This said "true" while the comment said CLOSED, and :9443 is reachable
      # from the internet, so /register was open to anyone. users_user was also
      # EMPTY, which means the first stranger to find the port would have been
      # the first account inside the error tracker. Creating the account does
      # not need this flag — `manage.py createsuperuser` works regardless:
      #   docker compose exec glitchtip-web ./manage.py createsuperuser
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      # Events are diagnostics, not records: cap the retention so this database
      # cannot grow without bound on a box that also serves the site.
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
      CELERY_WORKER_AUTOSCALE: "1,2"
    volumes:
      - glitchtipdata:/code/uploads
    expose:
      - "8000"

  glitchtip-worker:
    image: glitchtip/glitchtip@sha256:ef28cc4b92c8c9e427b8ddd55682d6aa155129ddf1c5db5f6bbbd09155fd3b6e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 600m
    pids_limit: 512
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    environment: *glitchtip_env
    volumes:
      - glitchtipdata:/code/uploads

  glitchtip-migrate:
    image: glitchtip/glitchtip@sha256:ef28cc4b92c8c9e427b8ddd55682d6aa155129ddf1c5db5f6bbbd09155fd3b6e
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on:
      glitchtip-db:
        condition: service_healthy
    environment: *glitchtip_env

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  matomodb:
  matomodata:
  redisdata:
  uploads:
  nextcache:
  glitchtipdb:
  glitchtipdata:
