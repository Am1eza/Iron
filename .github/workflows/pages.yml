name: Deploy preview to GitHub Pages

# Builds the Ahantime web app (in web/) as a static export and publishes it to
# GitHub Pages. Server-only routes (/api, the authed /account area) are excluded
# from the static build; the app stays full-SSR for `next dev` / `next start`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Remove server-only routes (unsupported by static export)
        # sitemap.ts is `dynamic = 'force-dynamic'` and `output: export` rejects
        # that outright. Deleting it here is the right answer rather than a
        # workaround: this job builds with NEXT_PUBLIC_API_MODE=mock, so the only
        # sitemap it could produce would list fixture URLs — which is the exact
        # failure the force-dynamic exists to prevent (see src/app/sitemap.ts).
        # A preview of mock data should not publish a sitemap at all.
        run: rm -rf src/app/api src/app/account src/app/sitemap.ts

      - name: Build static export
        run: pnpm build
        env:
          EXPORT: '1'
          PAGES_BASE_PATH: /Iron
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_SITE_URL: https://am1eza.github.io/Iron

      - name: Post-process export (.nojekyll)
        run: node scripts/pages-postbuild.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
