name: Deploy preview to GitHub Pages

# Builds the Ahantime web app (in web/) as a static export and publishes it to
# GitHub Pages. Server-only/auth-gated routes (/api, /account, /admin,
# /proforma) are excluded from the static build; the app stays full-SSR for
# `next dev` / `next start`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Remove server-only routes (unsupported by static export)
        # sitemap.ts is `dynamic = 'force-dynamic'` and `output: export` rejects
        # that outright. Deleting it here is the right answer rather than a
        # workaround: this job builds with NEXT_PUBLIC_API_MODE=mock, so the only
        # sitemap it could produce would list fixture URLs — which is the exact
        # failure the force-dynamic exists to prevent (see src/app/sitemap.ts).
        # A preview of mock data should not publish a sitemap at all.
        #
        # Test files are removed too: this job never runs tests, but `next
        # build` type-checks every file tsconfig includes, and some tests
        # import the api routes just deleted above.
        #
        # blog/news page/[n] archive routes never had a way to enumerate a
        # mock-fixture page 2 (4 blog + 3 news articles), so they're removed
        # rather than built.
        #
        # blog/[slug], blog/category/[slug], news/[slug], and everything
        # under prices/ no longer ship `generateStaticParams` at all (see
        # their own comments — removed so the real app renders them fresh per
        # request instead of relying on ISR/SSG), so `output: export` can no
        # longer build them either. They're removed here too, same as the
        # pre-existing factory/size removal below.
        #
        # about, cart, club, contact, cooperation(+[track]), cut-to-size,
        # login, market, privacy, tender, terms, tools/[tool], track,
        # warehouse, news/topic/[slug], blog/(index), news/(index) are
        # removed for a different, confirmed reason: the next-intl plugin
        # runs a second, separate per-route locale-resolution pass that
        # calls `headers()` on its own, outside of what `setRequestLocale`
        # (already added to each of these) can reach — `output: export`
        # hard-fails on it, and forcing these to `force-static` anyway was
        # tried and reverted because it built successfully but silently
        # served the DEFAULT locale's text on every OTHER locale's URL
        # (e.g. /en/about rendering Persian). That data-correctness bug is
        # worse than not previewing these routes at all. Real production
        # (SSR, not `output: export`) still renders these correctly — it
        # just does it dynamically instead of from a static/ISR cache; see
        # the project's own tracking note for the follow-up to fix that
        # properly upstream, not here.
        run: |
          rm -rf src/app/api src/app/admin src/app/uploads src/app/sitemap.ts
          rm -rf "src/app/[locale]/account" "src/app/[locale]/proforma"
          # /ai and /search opt into `dynamic = "error"` and read
          # searchParams — interactive, request-driven pages, not ones with
          # a static form.
          rm -rf "src/app/[locale]/ai" "src/app/[locale]/search"
          rm -rf "src/app/[locale]/blog/page" "src/app/[locale]/news/page"
          rm -rf "src/app/[locale]/blog/[slug]" "src/app/[locale]/blog/category" "src/app/[locale]/news/[slug]"
          rm -rf "src/app/[locale]/blog/(index)" "src/app/[locale]/news/(index)"
          rm -rf "src/app/[locale]/about" "src/app/[locale]/cart" "src/app/[locale]/club" \
            "src/app/[locale]/contact" "src/app/[locale]/cooperation" "src/app/[locale]/cut-to-size" \
            "src/app/[locale]/login" "src/app/[locale]/market" "src/app/[locale]/privacy" \
            "src/app/[locale]/tender" "src/app/[locale]/terms" "src/app/[locale]/tools" \
            "src/app/[locale]/track" "src/app/[locale]/warehouse" "src/app/[locale]/news/topic"
          # /request is also genuinely auth-gated (`requireUser` reads the
          # session cookie) on top of the same next-intl issue — it was
          # never a static-export candidate regardless.
          rm -rf "src/app/[locale]/request"
          # factory/size are free-text facets (skus.factory/size), not a
          # fixture-known taxonomy like category/sub — each route's own
          # comment explains why it has no generateStaticParams even in
          # EXPORT mode. The whole prices/ tree (index included) is removed
          # for the same reason as the list above: no build-time locale left
          # to fall back on once `force-dynamic` is stripped below.
          rm -rf "src/app/[locale]/prices"
          # Homepage hits the exact same next-intl issue as the list above
          # (confirmed directly, not assumed) — `force-dynamic` also means
          # `output: export` would refuse it outright even before that,
          # so there is no working middle ground for it here either.
          rm -rf "src/app/[locale]/page.tsx"
          find src -name '*.test.ts' -o -name '*.test.tsx' | xargs rm -f

      - name: Build static export
        run: pnpm build
        env:
          EXPORT: '1'
          PAGES_BASE_PATH: /Iron
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_SITE_URL: https://am1eza.github.io/Iron

      - name: Post-process export (.nojekyll)
        run: node scripts/pages-postbuild.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
