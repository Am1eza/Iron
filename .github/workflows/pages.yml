name: Deploy preview to GitHub Pages

# Builds the Ahantime web app (in web/) as a static export and publishes it to
# GitHub Pages. Server-only/auth-gated routes (/api, /account, /admin,
# /proforma) are excluded from the static build; the app stays full-SSR for
# `next dev` / `next start`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Remove server-only routes (unsupported by static export)
        # sitemap.ts is `dynamic = 'force-dynamic'` and `output: export` rejects
        # that outright. Deleting it here is the right answer rather than a
        # workaround: this job builds with NEXT_PUBLIC_API_MODE=mock, so the only
        # sitemap it could produce would list fixture URLs — which is the exact
        # failure the force-dynamic exists to prevent (see src/app/sitemap.ts).
        # A preview of mock data should not publish a sitemap at all.
        #
        # Test files are removed too: this job never runs tests, but `next
        # build` type-checks every file tsconfig includes, and some tests
        # import the api routes just deleted above.
        #
        # blog/news page/[n] archive routes deliberately return an empty
        # generateStaticParams (see their own comments) so the real app stays
        # ISR instead of fully dynamic — but `output: export` requires at
        # least one static path per dynamic segment, and the mock fixture set
        # (4 blog + 3 news articles) never reaches a page 2 to enumerate. Real
        # archive pagination is untestable from fixtures this small anyway.
        run: |
          rm -rf src/app/api src/app/account src/app/admin src/app/proforma src/app/uploads src/app/sitemap.ts
          # /ai opts into `dynamic = "error"` and reads searchParams — an
          # interactive chat shell, not a page with a static form.
          rm -rf src/app/ai
          rm -rf src/app/blog/page src/app/news/page
          # factory/size are free-text facets (skus.factory/size), not a
          # fixture-known taxonomy like category/sub — each route's own
          # comment explains why it has no generateStaticParams even in
          # EXPORT mode.
          rm -rf "src/app/prices/[category]/factory" "src/app/prices/[category]/size"
          find src -name '*.test.ts' -o -name '*.test.tsx' | xargs rm -f

      - name: Build static export
        run: pnpm build
        env:
          EXPORT: '1'
          PAGES_BASE_PATH: /Iron
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_SITE_URL: https://am1eza.github.io/Iron

      - name: Post-process export (.nojekyll)
        run: node scripts/pages-postbuild.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
