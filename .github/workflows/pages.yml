name: Deploy preview to GitHub Pages

# Builds the Ahantime web app (in web/) as a static export and publishes it to
# GitHub Pages. Server-only routes (/api, the authed /account area) are excluded
# from the static build; the app stays full-SSR for `next dev` / `next start`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Remove server-only routes (unsupported by static export)
        # sitemap.ts is `dynamic = 'force-dynamic'` and `output: export` rejects
        # that outright. Deleting it here is the right answer rather than a
        # workaround: this job builds with NEXT_PUBLIC_API_MODE=mock, so the only
        # sitemap it could produce would list fixture URLs — which is the exact
        # failure the force-dynamic exists to prevent (see src/app/sitemap.ts).
        # A preview of mock data should not publish a sitemap at all.
        run: rm -rf src/app/api src/app/account src/app/sitemap.ts

      - name: Build static export
        run: pnpm build
        env:
          EXPORT: '1'
          PAGES_BASE_PATH: /Iron
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_SITE_URL: https://am1eza.github.io/Iron

      - name: Post-process export (.nojekyll)
        run: node scripts/pages-postbuild.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
