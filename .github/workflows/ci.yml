name: CI

# Gate every push/PR on lint, types, unit tests, the production build, and
# an audit of production dependencies — none of this ran in CI before
# (pages.yml only builds the static mock demo; ai-smoke.yml is a nightly
# prod canary). e2e runs against the app's own self-contained pglite-backed
# dev server (see playwright.config.ts) — no external services needed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` below is pinned to a full 40-char commit SHA, with the human
# version in a trailing comment. A floating tag (`@v4`) is mutable: whoever
# controls the action's repo — or anyone who compromises it — can repoint the
# tag and have arbitrary code execute inside this job, with its GITHUB_TOKEN
# and any secret the job can read. That is precisely how the tj-actions and
# reviewdog supply-chain incidents worked. A SHA cannot be repointed.
# To upgrade: read the diff for the new release, then swap SHA + comment
# together.
#
# No job here needs to write anything back to the repo/PR — default to
# read-only so a compromised dependency executed during install/build (e.g. a
# malicious postinstall script) can't use the job's GITHUB_TOKEN to push
# commits, modify releases, or otherwise act with repo-write privileges.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (design tokens + RTL logical properties)
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --run

      # This step was labelled "live mode" while actually building with
      # NEXT_PUBLIC_API_MODE: mock — so CI had never once compiled the thing
      # that ships. `mock` swaps the whole data layer for fixtures, which means
      # every real fetch/serialization path, every server-only import and every
      # build-time data dependency of the ~250 prerendered SKU/blog/tool pages
      # went unbuilt and unchecked. A build-breaking change in any of them
      # would have sailed through a green CI and only failed in
      # deploy.yml's image build, after merge to main.
      #
      # `live` is what deploy.yml passes as a build-arg (see its `build-args:`
      # block, which defaults NEXT_PUBLIC_API_MODE to 'live'), so these now
      # match: CI builds the production artifact.
      - name: Build (production, live mode — must match deploy.yml's build-args)
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MODE: live
          NEXT_PUBLIC_SITE_URL: https://ahantime.com

      - name: Audit production dependencies (blocking on high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies (report only — dev tooling isn't shipped)
        if: always()
        run: pnpm audit --audit-level=high || true

  e2e:
    # A real merge gate. It caught a genuine, production-breaking bug on this
    # very PR: the sitewide Content-Security-Policy (added here) used
    # `script-src 'self'`, which blocks the Next.js App Router's inline
    # hydration/RSC-streaming scripts — every page rendered a dead,
    # non-interactive loading shell. The e2e run surfaced it (the table never
    # hydrated); the fix was to allow `'unsafe-inline'` for scripts (plus
    # `'unsafe-eval'` in dev only). Exactly the class of regression unit
    # tests can't see, which is why this job blocks.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, incl. axe-core accessibility scans)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
