name: Deploy to production server

# Build-once-deploy-many pipeline (see docker-compose.yml's comment on the
# `web` service): a single image is built and pushed to GHCR here, then the
# server only ever `docker compose pull`s that exact, already-tested tag —
# it never compiles Next.js itself. The deploy step is health-gated: it
# polls /api/health after the swap and automatically rolls back to the
# previous image if the new one never becomes healthy.
#
# NOT zero-downtime: this is a single-VPS Docker Compose stack, not a
# swarm/Kubernetes cluster, so recreating the `web` container has a brief
# (sub-second to a few seconds) gap while Caddy's upstream restarts. Real
# zero-downtime (blue/green with two upstreams behind Caddy, or moving to
# Swarm/Kubernetes) is deliberately out of scope for this deploy target —
# documented here rather than faked with a fragile two-container hack that
# would fail the same health-gate it's supposed to protect.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST            server IP or hostname
#   DEPLOY_USER            SSH user (e.g. root)
#   DEPLOY_SSH_KEY         private key authorized on the server (never a
#                          password — see DEPLOY.md's "Automatic deploys")
#   DEPLOY_PORT            optional, SSH port (default 22)
#   DEPLOY_PATH            optional, repo path on the server (default
#                          /opt/ahantime)
#   DEPLOY_HOST_FINGERPRINT  optional but recommended — the server's SSH
#                          host key fingerprint, pinned here so the Action
#                          verifies it instead of trust-on-first-use blindly
#                          accepting whatever key answers on the day this
#                          workflow happens to run.
#                          IMPORTANT: this must match whichever host-key
#                          algorithm the Go ssh client (easyssh/golang.org/
#                          x/crypto/ssh, used by appleboy/ssh-action) actually
#                          negotiates, not necessarily ed25519. It picks
#                          from the server's HostKeyAlgorithms order (see
#                          `sshd -T | grep hostkeyalgorithms`), which on
#                          this host puts ecdsa-sha2-nistp256 first. Verified
#                          2026-08-04: `ssh-keyscan -t ecdsa <host> |
#                          ssh-keygen -lf -` is what actually matched; the
#                          real ed25519 fingerprint failed with "host key
#                          fingerprint mismatch" even though it was the
#                          server's genuine ed25519 key. If this ever needs
#                          rotating again, do not assume ed25519 — check
#                          which algorithm actually connects first.
# Optional repo variables (Settings → Secrets and variables → Actions →
# Variables — plain, not secret, since NEXT_PUBLIC_* ships to every client
# bundle anyway):
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_API_MODE (defaults below match
#   production: https://ahantime.com / live)

# TRIGGER: this deploys ONLY after the `CI` workflow (.github/workflows/ci.yml)
# has finished successfully for a push to `main`.
#
# It used to trigger directly on `push: branches: [main]`, in parallel with and
# completely independent of CI. Nothing connected the two: `deploy`'s only
# `needs:` is this file's own `build` job, which compiles the image but runs no
# lint, no typecheck, no unit tests and no e2e. A commit that failed every
# check in CI would still build a perfectly valid image and ship it to
# production, with CI going red minutes later on a commit that was already
# live.
#
# `workflow_run` is used rather than merging CI into this file so the
# build-once-deploy-many pipeline documented above stays exactly as it is —
# the image is still built once here and the server still only pulls a tag.
#
# Three conditions are checked on every job below, not just `conclusion`:
#   - conclusion == 'success'  — CI actually passed (not failed/cancelled/skipped)
#   - event == 'push'          — CI also runs on `pull_request`; a green PR run
#                                must never deploy. `branches: [main]` filters
#                                the run's head_branch, but a PR whose SOURCE
#                                branch is named `main` would slip through it.
#   - head_branch == 'main'    — belt and braces with the filter above.
#
# And the commit is pinned explicitly: under `workflow_run`, `github.sha` is
# NOT the commit CI tested — it resolves to the default branch's head at
# dispatch time, which is a different commit the moment anything else lands.
# `github.event.workflow_run.head_sha` is the validated commit, so that is what
# gets checked out, what tags the image, and what the server resets to.
#
# FALLBACK: if this trigger ever misbehaves, `workflow_dispatch` below still
# deploys manually (Actions → Deploy to production server → Run workflow), and
# CLAUDE.md §5's manual recipe still works. A deploy that does not fire is a
# stopped pipeline, not a broken production.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to (re)deploy instead of building a new one — e.g. for a manual rollback'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Deny-by-default; each job grants only what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/am1eza/iron-web
  # The commit CI actually validated. Never `github.sha` — see the trigger
  # comment above. Falls back to `github.sha` for `workflow_dispatch`, where
  # there is no upstream run and `github.sha` IS the ref you dispatched from.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # Runs when CI went green for a push to main, OR on a manual dispatch that
    # did not name an existing tag to re-deploy. Anything else — CI red,
    # cancelled, a pull_request run, another branch — leaves this `skipped`,
    # and `deploy` below has nothing to consume.
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == ''
      || github.event_name == 'workflow_run'
         && github.event.workflow_run.conclusion == 'success'
         && github.event.workflow_run.event == 'push'
         && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write     # for build provenance attestation
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Pinned to the commit CI validated, NOT to whatever main points at now.
      # A default `actions/checkout` under `workflow_run` checks out the
      # default branch's current head, which is how a "CI-gated" pipeline
      # quietly ships a commit CI never saw.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.TARGET_SHA }}

      # Fail loudly rather than build something other than what CI tested.
      - name: Assert the checkout is the CI-validated commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "${TARGET_SHA}" ]; then
            echo "::error::checked out $actual but CI validated ${TARGET_SHA}"
            exit 1
          fi
          echo "Building CI-validated commit ${TARGET_SHA}"

      - id: tag
        run: echo "tag=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ahantime.com' }}
            NEXT_PUBLIC_API_MODE=${{ vars.NEXT_PUBLIC_API_MODE || 'live' }}
            NEXT_PUBLIC_DEPLOY_REGION=ir-docker
            GTM_ID=${{ vars.GTM_ID }}
            GA4_ID=${{ vars.GA4_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLSA-style provenance for the pushed image — lets anyone verify it
      # was built by this exact workflow run from this exact commit, not
      # hand-pushed by someone with a stolen registry token.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [build]
    # `always()` is only here so a manual re-deploy of an existing tag can run
    # with `build` skipped. It must NOT let a skipped-because-CI-failed build
    # through: that path is excluded by requiring the dispatch event
    # explicitly, so under `workflow_run` the ONLY way here is
    # `needs.build.result == 'success'`, which in turn required CI green.
    if: >-
      always() && !cancelled()
      && (
        needs.build.result == 'success'
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH (health-gated, auto-rollback)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TARGET_TAG: ${{ github.event.inputs.image_tag || needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: TARGET_TAG,GHCR_TOKEN,GHCR_ACTOR
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH || '/opt/ahantime' }}"
            IMAGE="ghcr.io/am1eza/iron-web"
            cd "$APP_DIR"

            # Repo checkout still tracks docker-compose.yml/Caddyfile/migration
            # files and any non-image config — only the app *image* is now
            # pre-built, not the code checkout itself.
            git fetch origin main

            # `git reset --hard` is unrecoverable for anything not committed,
            # and on THIS host the repo directory is also the live deploy
            # directory (see CLAUDE.md §2) — operators and agents routinely
            # have work in progress in it. A hotfix applied by hand at 2am, a
            # Caddyfile tweak mid-debug, an in-flight compose change: a deploy
            # firing at the wrong moment silently destroyed all of it with no
            # copy anywhere.
            #
            # Stash modifications to TRACKED files only, and leave the stash in
            # the list rather than popping it back: re-applying unknown local
            # edits on top of the commit we are about to deploy is how you ship
            # something nobody reviewed. The operator recovers it deliberately
            # with `git stash list` / `git stash apply <ref>`.
            #
            # Deliberately NO `-u`/`--include-untracked`. `git reset --hard`
            # only ever reverts tracked files — untracked and ignored files
            # survive it untouched — so stashing them protects nothing while
            # adding a way to MOVE files that must not move. `.env` lives in
            # this directory and holds every production secret including
            # WEB_IMAGE, which the lines below read and rewrite; if it were
            # ever unignored (or `-a` were used), `git stash push -u` would
            # sweep it away mid-deploy and take the site down with it.
            if ! git diff --quiet HEAD --; then
              STASH_MSG="pre-deploy autostash $(date -u +%Y-%m-%dT%H:%M:%SZ) (deploy ${TARGET_TAG})"
              echo "::warning::Uncommitted server-side changes found in $APP_DIR — stashing before reset. Recover with: git stash list; git stash apply <ref>"
              git status --porcelain
              git stash push -m "$STASH_MSG"
              echo "Stashed as: $STASH_MSG — NOT reapplied; recover deliberately."
            fi

            # Reset to the EXACT commit CI validated and this image was built
            # from — not to whatever origin/main points at right now.
            #
            # `git reset --hard origin/main` looked equivalent, and usually
            # was, but it is the same class of bug as the trigger this
            # workflow just fixed: if anything lands on main between CI going
            # green and this SSH step running, the server ends up running an
            # image built from commit A while docker-compose.yml, the
            # Caddyfile and the migration files on disk come from commit B.
            # Build-once-deploy-many only holds if the checkout and the image
            # are the same commit.
            #
            # main is left pointing at the deployed commit (possibly behind
            # origin/main); the next deploy moves it forward. That is the
            # correct invariant here: this directory should describe what is
            # actually running.
            git checkout main
            if ! git rev-parse --verify --quiet "${TARGET_TAG}^{commit}" >/dev/null; then
              git fetch --quiet origin "$TARGET_TAG" 2>/dev/null || true
            fi
            if git rev-parse --verify --quiet "${TARGET_TAG}^{commit}" >/dev/null; then
              git reset --hard "$TARGET_TAG"
            else
              # A dispatched image_tag that is not a commit in this repo (an
              # old/foreign tag). Deploy the image, but say plainly that the
              # checkout could not be matched to it.
              echo "::warning::${TARGET_TAG} is not a commit in this repository — leaving the checkout on origin/main; compose/Caddyfile/migrations may not match the deployed image"
              git reset --hard origin/main
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            PREV_TAG="$(grep -oP '^WEB_IMAGE=\K.*' .env 2>/dev/null || true)"
            NEW_IMAGE="${IMAGE}:${TARGET_TAG}"
            echo "Deploying ${NEW_IMAGE} (previous: ${PREV_TAG:-none})"

            docker pull "$NEW_IMAGE"

            if grep -q '^WEB_IMAGE=' .env 2>/dev/null; then
              sed -i "s#^WEB_IMAGE=.*#WEB_IMAGE=${NEW_IMAGE}#" .env
            else
              echo "WEB_IMAGE=${NEW_IMAGE}" >> .env
            fi

            # `db` must already be running for the backup below — bring the
            # rest of the stack up first (harmless no-op if it's already up).
            docker compose up -d db caddy

            # Get the Caddyfile's current contents into the RUNNING Caddy.
            #
            # `up -d caddy` above does NOT do this, and neither does a plain
            # `caddy reload`. Two separate reasons, both needed to understand
            # why this is a force-recreate:
            #
            #  1. The Caddyfile arrives via a read-only bind mount
            #     (`./Caddyfile:/etc/caddy/Caddyfile:ro`), so editing it leaves
            #     the service's compose spec identical — Compose sees no change
            #     and leaves the container alone, still serving the config it
            #     parsed at boot.
            #  2. Bind-mounting a single FILE pins the mount to that file's
            #     INODE. `git reset --hard` above does not edit in place; it
            #     writes a new file and renames it over the old one, which is a
            #     new inode. The container therefore keeps reading the file it
            #     was started with — the pre-deploy contents — no matter what
            #     the host path now says. Verified directly on the server: the
            #     host Caddyfile had the new block, `grep` inside the container
            #     did not, and `caddy reload` dutifully re-read the stale copy
            #     and reported success.
            #
            # So every Caddyfile change merged since this pipeline was written
            # deployed its file but never its effect, silently, with the
            # workflow still reporting success. `--force-recreate` rebuilds the
            # container so the mount re-resolves to the current inode. It costs
            # the same brief blip this deploy already documents as non-zero-
            # downtime, and TLS certs survive it (they live in the `caddy_data`
            # volume, not the container).
            #
            # Validate BEFORE recreating: a syntax error caught here fails the
            # deploy with the old container still happily serving, instead of
            # taking the edge down and leaving it down.
            #
            # Done in a THROWAWAY container, not `compose exec` on the running
            # one — exec would hit reason (2) above and validate the very stale
            # copy this step exists to replace, passing while the real file is
            # broken. A fresh `docker run` mounts the host path now, so it sees
            # the current inode. Image tag tracks the `caddy` service's.
            docker run --rm -v "$APP_DIR/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose up -d --force-recreate caddy

            # DB backup right before the swap — cheap insurance against a
            # migration in the new image going wrong (entrypoint runs
            # migrations automatically on container start; see DEPLOY.md).
            # Checked explicitly (not `|| true` on the whole pipeline) so a
            # failed backup is loud, not a silently-empty .sql.gz — without
            # `pipefail`, `cmd | gzip || true` would swallow cmd's failure
            # since only gzip's own exit code is checked.
            # umask BEFORE the redirect: these dumps are a full pg_dump of
            # production — every lead, customer mobile, order and proforma —
            # and the default umask left them 0644, readable by any non-root
            # user or any process that gets a foothold on the host. A one-off
            # chmod would not hold, since every deploy recreates them.
            umask 077
            mkdir -p backups
            chmod 700 backups
            BACKUP_FILE="backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            if docker compose exec -T db pg_dump -U ahantime ahantime | gzip > "$BACKUP_FILE"; then
              echo "Backup written: $BACKUP_FILE"
            else
              echo "::warning::pre-deploy backup failed — continuing deploy without one"
              rm -f "$BACKUP_FILE"
            fi
            find backups -name '*.sql.gz' -mtime +14 -delete || true

            docker compose up -d web

            # The image is built without DATABASE_URL (see page.tsx's hasDb()
            # guard) so any static prerender that reads DB-backed content
            # bakes in whatever hasDb()===false falls back to — the homepage
            # got the price-table fallback instead of the configured hero
            # video (confirmed live 2026-08-06). Every page listed here uses
            # a real `revalidate` window, so it DOES self-correct once a
            # request triggers ISR regeneration with the container's actual
            # runtime DB access — but that leaves a real window (minutes)
            # where every visitor sees the stale/fallback render, on EVERY
            # deploy. Deleting the stale pre-rendered files forces the very
            # next request to do a full fresh render instead of waiting on
            # traffic to trigger it.
            #
            # /blog and /news are here for the same reason as the homepage,
            # confirmed live 2026-08-07: shipping the article-category rail
            # (US-14.5) — a real DB read on those two pages that CI's
            # DB-less build could not know about — served the pre-rendered,
            # railless shell for the first several minutes after every
            # deploy that touches either page, until a manual container
            # restart forced a fresh render. Any future page added with a
            # `revalidate` window and a DB-backed render belongs in this
            # list too — this is a recurring class of bug, not a one-off.
            #
            # /market joined 2026-08-14: its own "مطالعهٔ بیشتر" related-
            # article read hit the exact same DB-less-build fallback (empty
            # section) on the deploy that added it, confirmed live before
            # this line was added — the class of bug this comment already
            # predicted.
            docker compose exec -T web sh -c \
              "rm -f .next/server/app/index.html .next/server/app/index.rsc .next/server/app/index.meta \
                     .next/server/app/blog.html .next/server/app/blog.rsc .next/server/app/blog.meta \
                     .next/server/app/news.html .next/server/app/news.rsc .next/server/app/news.meta \
                     .next/server/app/market.html .next/server/app/market.rsc .next/server/app/market.meta" || true

            # Health gate: the new container must answer 200 on /api/health
            # before this counts as a success. No curl/wget in the runner
            # image (see docker-compose.yml's healthcheck comment) — use
            # Node's built-in fetch the same way the container healthcheck
            # does.
            ok=false
            for i in $(seq 1 24); do
              if docker compose exec -T web node -e \
                "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              then
                ok=true
                break
              fi
              sleep 5
            done

            if [ "$ok" != "true" ]; then
              echo "Health check failed after deploy — rolling back to ${PREV_TAG:-<none, nothing to roll back to>}"
              if [ -n "$PREV_TAG" ]; then
                sed -i "s#^WEB_IMAGE=.*#WEB_IMAGE=${PREV_TAG}#" .env
                docker compose up -d web
              fi
              exit 1
            fi

            echo "Deploy succeeded: ${NEW_IMAGE}"
            docker image prune -f --filter "until=72h" || true
